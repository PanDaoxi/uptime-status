<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
    <title>Uptime Status</title>
    <script src="./config.js"></script>
    <script defer src="/static/js/main.ace24a8b.js"></script>
    <link href="/static/css/main.e4003dc1.css" rel="stylesheet">
    <style>
        @font-face {
            font-family: HYTMR;
            src: url(https://npm.elemecdn.com/fontcdn-ariasaka@1.0.0/HYTangMeiRen55W.woff2) format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap
        }

        body {
            font-family: HYTMR, "Helvetica Neue", Helvetica, Arial, sans-serif
        }

        #cursor {
            position: fixed;
            width: 16px;
            height: 16px;
            background: rgb(111, 66, 193);
            border-radius: 8px;
            opacity: 0.25;
            z-index: 10086;
            pointer-events: none;
            transition: 0.2s ease-in-out;
            transition-property: background, opacity, transform;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script>
        (() => {
            var CURSOR;

            Math.lerp = (a, b, n) => (1 - n) * a + n * b;

            const getStyle = (el, attr) => {
                try {
                    return window.getComputedStyle
                        ? window.getComputedStyle(el)[attr]
                        : el.currentStyle[attr];
                } catch (e) { }
                return "";
            };

            class Cursor {
                constructor() {
                    this.pos = { curr: null, prev: null };
                    this.pt = [];
                    this.create();
                    this.init();
                    this.render();
                }

                move(left, top) {
                    this.cursor.style["left"] = `${left}px`;
                    this.cursor.style["top"] = `${top}px`;
                }

                create() {
                    if (!this.cursor) {
                        this.cursor = document.createElement("div");
                        this.cursor.id = "cursor";
                        this.cursor.classList.add("hidden");
                        document.body.append(this.cursor);
                    }

                    var el = document.getElementsByTagName("*");
                    for (let i = 0; i < el.length; i++)
                        if (getStyle(el[i], "cursor") == "pointer")
                            this.pt.push(el[i].outerHTML);

                    document.body.appendChild(
                        (this.scr = document.createElement("style"))
                    );
                    this.scr.innerHTML = `* {cursor: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' width='8px' height='8px'><circle cx='4' cy='4' r='4' opacity='1.0' fill='rgb(111, 66, 193)'/></svg>") 4 4, auto}`;
                }

                refresh() {
                    this.scr.remove();
                    this.cursor.classList.remove("hover");
                    this.pos = { curr: null, prev: null };
                    this.pt = [];

                    this.create();
                    this.init();
                    this.render();
                }

                init() {
                    document.onmouseover = (e) =>
                        this.pt.includes(e.target.outerHTML) &&
                        this.cursor.classList.add("hover");
                    document.onmouseout = (e) =>
                        this.pt.includes(e.target.outerHTML) &&
                        this.cursor.classList.remove("hover");
                    document.onmousemove = (e) => {
                        this.pos.curr == null &&
                            this.move(e.clientX - 8, e.clientY - 8);
                        this.pos.curr = { x: e.clientX - 8, y: e.clientY - 8 };
                        this.cursor.classList.remove("hidden");
                    };
                    document.onmouseenter = (e) =>
                        this.cursor.classList.remove("hidden");
                    document.onmouseleave = (e) => this.cursor.classList.add("hidden");

                    // 恢复鼠标按下特效（但不使用active类）
                    document.onmousedown = (e) => {
                        // 鼠标按下时缩小光标
                        this.cursor.style.transform = "scale(0.75)";
                    };
                    document.onmouseup = (e) => {
                        // 鼠标释放时恢复原大小
                        this.cursor.style.transform = "scale(1)";
                    };
                }

                render() {
                    if (this.pos.prev) {
                        this.pos.prev.x = Math.lerp(
                            this.pos.prev.x,
                            this.pos.curr.x,
                            0.15
                        );
                        this.pos.prev.y = Math.lerp(
                            this.pos.prev.y,
                            this.pos.curr.y,
                            0.15
                        );
                        this.move(this.pos.prev.x, this.pos.prev.y);
                    } else {
                        this.pos.prev = this.pos.curr;
                    }
                    requestAnimationFrame(() => this.render());
                }
            }

            (() => {
                CURSOR = new Cursor();
                // 需要重新获取列表时，使用 CURSOR.refresh()
            })();
        })();
        !function () {
            function n(n, e, t) {
                return n.getAttribute(e) || t
            }

            function e(n) {
                return document.getElementsByTagName(n)
            }

            function t() {
                var t = e("script"), o = t.length, i = t[o - 1];
                return { l: o, z: n(i, "zIndex", -1), o: n(i, "opacity", .5), c: n(i, "color", "0,0,0"), n: n(i, "count", 99) }
            }

            function o() {
                a = m.width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth, c = m.height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight
            }

            function i() {
                r.clearRect(0, 0, a, c);
                var n, e, t, o, m, l;
                s.forEach(function (i, x) {
                    for (i.x += i.xa, i.y += i.ya, i.xa *= i.x > a || i.x < 0 ? -1 : 1, i.ya *= i.y > c || i.y < 0 ? -1 : 1, r.fillRect(i.x - .5, i.y - .5, 1, 1), e = x + 1; e < u.length; e++) n = u[e], null !== n.x && null !== n.y && (o = i.x - n.x, m = i.y - n.y, l = o * o + m * m, l < n.max && (n === y && l >= n.max / 2 && (i.x -= .03 * o, i.y -= .03 * m), t = (n.max - l) / n.max, r.beginPath(), r.lineWidth = t / 2, r.strokeStyle = "rgba(" + d.c + "," + (t + .2) + ")", r.moveTo(i.x, i.y), r.lineTo(n.x, n.y), r.stroke()))
                }), x(i)
            }

            var a, c, u, m = document.createElement("canvas"), d = t(), l = "c_n" + d.l, r = m.getContext("2d"),
                x = window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || window.oRequestAnimationFrame || window.msRequestAnimationFrame || function (n) {

            u = s.concat([y]), setTimeout(function () {
                i()

        }();

        class Circle {
            constructor({ origin, speed, color, angle, context }) {
                this.origin = origin
                this.position = { ...this.origin }
                this.color = color
                this.speed = speed
                this.angle = angle
                this.context = context
                this.renderCount = 0
            }

            draw() {
                this.context.fillStyle = this.color
                this.context.beginPath()
                this.context.arc(this.position.x, this.position.y, 2, 0, Math.PI * 2)
                this.context.fill()
            }

            move() {
                this.position.x = (Math.sin(this.angle) * this.speed) + this.position.x
                this.position.y = (Math.cos(this.angle) * this.speed) + this.position.y + (this.renderCount * 0.3)
                this.renderCount++
            }
        }

        class Boom {
            constructor({ origin, context, circleCount = 16, area }) {
                this.origin = origin
                this.context = context
                this.circleCount = circleCount
                this.area = area
                this.stop = false
                this.circles = []
            }

            randomArray(range) {
                const length = range.length
                const randomIndex = Math.floor(length * Math.random())
                return range[randomIndex]
            }

            randomColor() {
                const range = ['8', '9', 'A', 'B', 'C', 'D', 'E', 'F']
                return '#' + this.randomArray(range) + this.randomArray(range) + this.randomArray(range) + this.randomArray(range) + this.randomArray(range) + this.randomArray(range)
            }

            randomRange(start, end) {
                return (end - start) * Math.random() + start
            }

            init() {
                for (let i = 0; i < this.circleCount; i++) {
                    const circle = new Circle({
                        context: this.context,
                        origin: this.origin,
                        color: this.randomColor(),
                        angle: this.randomRange(Math.PI - 1, Math.PI + 1),
                        speed: this.randomRange(1, 6)
                    })
                    this.circles.push(circle)
                }
            }

            move() {
                this.circles.forEach((circle, index) => {
                    if (circle.position.x > this.area.width || circle.position.y > this.area.height) {
                        return this.circles.splice(index, 1)
                    }
                    circle.move()
                })
                if (this.circles.length == 0) {
                    this.stop = true
                }
            }

            draw() {
                this.circles.forEach(circle => circle.draw())
            }
        }

        class CursorSpecialEffects {
            constructor() {
                this.computerCanvas = document.createElement('canvas')
                this.renderCanvas = document.createElement('canvas')

                this.computerContext = this.computerCanvas.getContext('2d')
                this.renderContext = this.renderCanvas.getContext('2d')

                this.globalWidth = window.innerWidth
                this.globalHeight = window.innerHeight

                this.booms = []
                this.running = false
            }

            handleMouseDown(e) {
                const boom = new Boom({
                    origin: { x: e.clientX, y: e.clientY },
                    context: this.computerContext,
                    area: {
                        width: this.globalWidth,
                        height: this.globalHeight
                    }
                })
                boom.init()
                this.booms.push(boom)
                this.running || this.run()
            }

            handlePageHide() {
                this.booms = []
                this.running = false
            }

            init() {
                const style = this.renderCanvas.style
                style.position = 'fixed'
                style.top = style.left = 0
                style.zIndex = '999999999999999999999999999999999999999999'
                style.pointerEvents = 'none'

                style.width = this.renderCanvas.width = this.computerCanvas.width = this.globalWidth
                style.height = this.renderCanvas.height = this.computerCanvas.height = this.globalHeight

                document.body.append(this.renderCanvas)

                window.addEventListener('mousedown', this.handleMouseDown.bind(this))
                window.addEventListener('pagehide', this.handlePageHide.bind(this))
            }

            run() {
                this.running = true
                if (this.booms.length == 0) {
                    return this.running = false
                }

                requestAnimationFrame(this.run.bind(this))

                this.computerContext.clearRect(0, 0, this.globalWidth, this.globalHeight)
                this.renderContext.clearRect(0, 0, this.globalWidth, this.globalHeight)

                this.booms.forEach((boom, index) => {
                    if (boom.stop) {
                        return this.booms.splice(index, 1)
                    }
                    boom.move()
                    boom.draw()
                })
                this.renderContext.drawImage(this.computerCanvas, 0, 0, this.globalWidth, this.globalHeight)
            }
        }

        const cursorSpecialEffects = new CursorSpecialEffects()
        cursorSpecialEffects.init()
    </script>
</body>

</html>
